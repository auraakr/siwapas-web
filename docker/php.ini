; SIWAPAS overrides on top of php.ini-production.
; Uploads: payment proofs and photos are at most 5 MB each (validated in the app); leave headroom
; for a request with a few photos.
upload_max_filesize = 12M
post_max_size = 24M
memory_limit = 512M
max_execution_time = 60

expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
